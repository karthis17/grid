stages:
  - build
  - deploy

variables:
  # Enables static export (output: "export") defined in next.config.ts
  OUTPUT_EXPORT: "true"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/
    - .next/cache/

build:
  stage: build
  image: node:20-alpine
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/.npm"
  before_script:
    - npm ci --prefer-offline
  script:
    - npm run build:export
    # Fail early if the export folder was not produced
    - test -d out && ls out | head
  artifacts:
    name: "static-export-$CI_COMMIT_SHORT_SHA"
    paths:
      - out/
    expire_in: 1 day
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'

deploy:
  stage: deploy
  image: alpine:latest
  needs: ["build"]
  variables:
    # Override in GitLab CI/CD Variables if cPanel uses a custom port (e.g. 2222)
    SSH_PORT: "22"
  before_script:
    - apk add --no-cache openssh-client rsync bash

    # Verify required variables exist (fails with a clear message instead of a cryptic error)
    - |
      for v in SSH_PRIVATE_KEY SSH_HOST SSH_USER DEPLOY_DIR; do
        eval "val=\${$v}"
        if [ -z "$val" ]; then
          echo "ERROR: CI/CD variable $v is empty or not set."
          echo "Check it exists, has the right type, and that 'Protected' matches this branch."
          exit 1
        fi
      done

    - eval $(ssh-agent -s)
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh

    # SSH_PRIVATE_KEY should be a File-type variable (works with a plain Variable too)
    - |
      if [ -f "$SSH_PRIVATE_KEY" ]; then
        tr -d '\r' < "$SSH_PRIVATE_KEY" | ssh-add -
      else
        echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
      fi

    # Trust the server's host key (no "|| true" so failures are visible)
    - ssh-keyscan -p "${SSH_PORT}" -H "$SSH_HOST" >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    # Debug: confirm connection and that rsync exists on the server
    - echo "Deploying to $SSH_USER@$SSH_HOST:${DEPLOY_DIR%/}/ (port ${SSH_PORT})"
    - ssh -p "${SSH_PORT}" "$SSH_USER@$SSH_HOST" "echo connected && which rsync"

    # Sync static export to the cPanel document root
    # --chmod gives cPanel-friendly permissions (755 dirs, 644 files)
    # --delete removes remote files not present in out/ (test on a subfolder first!)
    - rsync -avz --delete --chmod=D755,F644 -e "ssh -p ${SSH_PORT}" out/ "$SSH_USER@$SSH_HOST:${DEPLOY_DIR%/}/"
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
