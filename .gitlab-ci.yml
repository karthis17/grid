stages:
  - build
  - deploy

build:
  stage: build
  image: node:20-alpine
  variables:
    OUTPUT_EXPORT: "true"
    npm_config_cache: "$CI_PROJECT_DIR/.npm"
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  script:
    - npm ci --prefer-offline
    - npm run build:export
    - ls out
  artifacts:
    paths:
      - out/
    expire_in: 1 day
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'

deploy:
  stage: deploy
  image: alpine:latest
  needs:
    - build
  variables:
    SSH_PORT: "22"
  before_script:
    - apk add --no-cache openssh-client rsync
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - tr -d '\r' < "$SSH_PRIVATE_KEY" > ~/.ssh/id_key
    - echo >> ~/.ssh/id_key
    - chmod 600 ~/.ssh/id_key
  script:
    - echo "Host=$SSH_HOST User=$SSH_USER Port=$SSH_PORT Dir=$DEPLOY_DIR"
    - ssh -i ~/.ssh/id_key -p "$SSH_PORT" -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" "echo connected; which rsync"
    - rsync -avz --delete --chmod=D755,F644 -e "ssh -i ~/.ssh/id_key -p $SSH_PORT -o StrictHostKeyChecking=accept-new" out/ "$SSH_USER@$SSH_HOST:$DEPLOY_DIR/"
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'